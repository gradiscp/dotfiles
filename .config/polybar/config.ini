# Polybar config

# Colors based on gruvbox color scheme
[colors]
background = #48000000
#15A9A9A9
foreground = #FFFFFF
disabled = #000000

black = #FFFFFF
charging = #008000
alert  = #A9A9A9

wm-restack = bspwm

[bar/main]
width = 100%
height = 40
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}

spacing = 4
lineheight = 26
padding-left = 2
padding-right = 2
module-margin-left = 4
module-margin-right = 5

font-0 = Roboto:size=14;2
font-1 = Roboto:size16;2
font-2 = FontAwesome:size=11;2

modules-left = xworkspaces
modules-center = date
modules-right = battery pulseaudio wlan


separator = "|"
separator-foreground = ${colors.black}

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-underline= ${colors.black}
label-active-foreground = ${colors.black}
label-active-padding = 4

label-occupied = %name%
label-occupied-foreground = ${colors.alert}
label-occupied-padding = 4

label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 4

label-empty = %name%
label-empty-foreground = ${colors.alert}
label-empty-padding = 4

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.alert}
format-volume = <label-volume>
format-volume-foreground = ${colors.alert}

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.alert}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
label-connected-foreground = ${colors.alert}
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
type = internal/network
interface = wlp45s0
interval = 3.0

format-connected = <ramp-signal><label-connected>
label-connected-foreground = ${colors.alert}
label-connected = %essid%

format-disconnected = <label-disconnected>
;format-disconnected-underline = ${self.format-connected-underline}
label-disconnected = disconnected
label-disconnected-foreground = ${colors.alert}

ramp-signal-0 = 1
ramp-signal-1 = 2
ramp-signal-2 = 3
ramp-signal-3 = 4
ramp-signal-4 = 5
ramp-signal-foreground = ${colors.alert}


[module/date]
type = internal/date
interval = 1
content-font = 2

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.black}


[module/battery]
type = internal/battery
; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 99

format-charging-foreground = ${colors.charging}
format-discharging-foreground = ${colors.alert}

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 5

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT1
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5

