<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- JetBrainsMono Nerd Font for everything that does not ask for a specific
       font. Omarchy's /etc/fonts/conf.d/50-omarchy.conf assigns sans-serif,
       serif, system-ui and the Apple UI aliases to Liberation Sans/Serif
       before this file is read, so the generic names are already gone from
       the pattern here; putting JetBrains Mono right in front of the
       Liberation families ("prepend", not "prepend_first") makes those
       resolve to it while a font an app asks for by name (icon fonts,
       Omawrite's iA Writer) still wins. Trade-off: web pages that name no
       font become monospace. To get the normal web fonts back, delete these
       two blocks and keep only the embolden rule below. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Liberation Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Liberation Serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Only Regular/Bold weights are installed, no Medium/SemiBold.
       Synthetic embolden makes regular text a bit thicker everywhere
       without switching to the much heavier real Bold face. -->
  <match target="font">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test name="weight" compare="less_eq">
      <const>medium</const>
    </test>
    <edit name="embolden" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
