# suspend-then-hibernate (closed lid on battery, the menu's Suspend): after
# 2 hours in suspend the laptop hibernates, so a bag does not drain the
# battery. Omarchy already set up the swapfile, resume and the RTC alarm that
# s2idle needs for the wakeup; waking from hibernation asks for the LUKS
# passphrase. Installed by install.sh to /etc/systemd/sleep.conf.d/.
[Sleep]
HibernateDelaySec=2h
