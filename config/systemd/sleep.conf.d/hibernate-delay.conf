# suspend-then-hibernate (closed lid, the menu's Suspend): after 2 hours in
# suspend on battery the laptop hibernates, so a bag does not drain the
# battery. On AC power it stays suspended; the 2 hours start when it is
# unplugged (HibernateOnACPower=no, systemd 257+). Omarchy already set up the
# swapfile, resume and the RTC alarm that s2idle needs for the wakeup; waking
# from hibernation asks for the LUKS passphrase. Installed by install.sh to
# /etc/systemd/sleep.conf.d/.
[Sleep]
HibernateDelaySec=2h
HibernateOnACPower=no
