# Closed lid, on battery or on AC: suspend, then hibernate once 2 hours on
# battery have passed (sleep.conf.d/hibernate-delay.conf). Docked (external
# monitor) logind's default "ignore" stays. Installed by install.sh to
# /etc/systemd/logind.conf.d/; `systemctl reload systemd-logind` applies it.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
