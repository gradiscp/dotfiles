# Closed lid on battery: suspend, then hibernate after HibernateDelaySec
# (sleep.conf.d/hibernate-delay.conf). On external power plain suspend; docked
# (external monitor) logind's default "ignore" stays. Installed by install.sh
# to /etc/systemd/logind.conf.d/; `systemctl reload systemd-logind` applies it.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
