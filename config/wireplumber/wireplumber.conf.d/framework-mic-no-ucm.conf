## Framework Laptop 13 (AMD Ryzen AI 300): the internal mic sits on the
## Realtek ALC285, but UCM routes it to the ACP PDM card (acp-pdm-mach), which
## is not wired on this board and returns a constant -32768 on every sample
## (kernel bugzilla 222063, FrameworkComputer/SoftwareFirmwareIssueTracker#166).
## Without UCM, PipeWire drives the codec itself: internal mic, speaker and
## the headphone jack. Matched by name: the codec's own ids (alsa.components)
## are not set yet when the rules run. install.sh links this file only on a
## Framework.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_c1_00.6"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
      }
    }
  }
]
