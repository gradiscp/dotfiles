## Auto-connect A2DP playback/capture profiles on Bluetooth devices.
## This helps speakers and receivers expose their audio profiles without
## requiring manual PipeWire/WirePlumber recovery. hfp_hf keeps the
## hands-free profile in the list: without it a headset (AirPods) connects
## for music only and has no microphone until reconnected by hand.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf a2dp_sink a2dp_source ]
      }
    }
  }
]
