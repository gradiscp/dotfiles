# Omasnap (Omarchy's screenshot tool): only what differs from its defaults.
# SUPER+SHIFT+S runs plain `omasnap` (config/hypr/bindings.lua). Without a
# file per shot: a capture is copied to the clipboard and previewed, and it
# still lands on the recents shelf. Edit -> Save writes a file when one is
# wanted (~/Pictures/Screenshots).
[output]
autosave = false
