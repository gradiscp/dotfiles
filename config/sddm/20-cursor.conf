# Cursor on the SDDM greeter (only seen after a logout - boots autologin).
# Without this SDDM falls back to the default theme at 24px, which looked
# oversized next to the desktop's Bibata-Modern-Ice 14 (looknfeel.lua,
# gsettings.sh). SDDM exports these as XCURSOR_THEME / XCURSOR_SIZE to the
# greeter's Hyprland; Bibata is installed system-wide under /usr/share/icons,
# so the sddm user can read it. Installed to /etc/sddm.conf.d/ by install.sh.
[Theme]
CursorTheme=Bibata-Modern-Ice
CursorSize=14
